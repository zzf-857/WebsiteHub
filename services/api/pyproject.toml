[project]
name = "webhub-api"
version = "0.1.0"
description = "FastAPI business service for the WebHub website"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.17,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "cryptography>=46,<47",
  "fastapi==0.139.2",
  "httpx>=0.28,<1.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langgraph>=0.6,<2.0",
  "mcp>=1.24,<2",
  # 直接依赖：config.py 在导入时读 .env。此前它只是 uvicorn[standard] 的传递依赖，
  # 换个 uvicorn extra 就会静默消失。
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
webhub-bookmarks-preview = "webhub.bookmarks.cli:main"
webhub-db = "webhub.db.cli:main"
webhub-account = "webhub.auth.cli:main"

[dependency-groups]
dev = [
  "httpx2==2.9.1",
  "pytest>=9.0,<10.0",
  "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhub"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
